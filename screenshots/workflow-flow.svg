<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">From a fired tag to a sent email</text>

  <rect x="30" y="70" width="200" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="130" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">1. Tag fired</text>
  <text x="130" y="116" text-anchor="middle" font-size="12" fill="#1e1b4b">app, form, API or workflow</text>

  <rect x="290" y="70" width="200" height="64" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="390" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">2. Update the contact</text>
  <text x="390" y="116" text-anchor="middle" font-size="12" fill="#064e3b">remove tags, set fields, add tag</text>

  <rect x="550" y="70" width="200" height="64" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="650" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">3. Record a tag task</text>
  <text x="650" y="116" text-anchor="middle" font-size="12" fill="#064e3b">pending, running, done, failed</text>

  <rect x="810" y="70" width="160" height="64" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="890" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">4. Tag actions</text>
  <text x="890" y="116" text-anchor="middle" font-size="12" fill="#831843">each runs on a queue</text>

  <!-- branches -->
  <rect x="560" y="190" width="200" height="64" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="660" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">Integration or email</text>
  <text x="660" y="236" text-anchor="middle" font-size="12" fill="#831843">action job on the actions queue</text>

  <rect x="800" y="190" width="170" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="885" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Start workflow</text>
  <text x="885" y="236" text-anchor="middle" font-size="12" fill="#78350f">queue row per contact</text>

  <!-- workflow engine -->
  <rect x="30" y="300" width="940" height="230" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Workflow queue: runs one step at a time for each contact</text>

  <rect x="50" y="350" width="160" height="60" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="130" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Inline steps</text>
  <text x="130" y="394" text-anchor="middle" font-size="11" fill="#064e3b">add or remove tag, field, move</text>

  <rect x="230" y="350" width="160" height="60" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="310" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Timer</text>
  <text x="310" y="394" text-anchor="middle" font-size="11" fill="#78350f">delayed job, resumes later</text>

  <rect x="410" y="350" width="160" height="60" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="490" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Split</text>
  <text x="490" y="394" text-anchor="middle" font-size="11" fill="#4c1d95">branch on tags or condition</text>

  <rect x="590" y="350" width="170" height="60" rx="8" fill="#ffffff" stroke="#db2777"/>
  <text x="675" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">Email, SMS, integration</text>
  <text x="675" y="394" text-anchor="middle" font-size="11" fill="#831843">action job, worker sends</text>

  <rect x="780" y="350" width="170" height="60" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="865" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Goal check</text>
  <text x="865" y="394" text-anchor="middle" font-size="11" fill="#0f172a">goal met ends the journey</text>

  <rect x="50" y="440" width="900" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="500" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">After every send, provider webhooks report back</text>
  <text x="500" y="488" text-anchor="middle" font-size="12" fill="#334155">delivered, opened, clicked, bounced, complained, unsubscribed: updates the message, the contact and the contact status</text>

  <line x1="230" y1="102" x2="286" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="102" x2="546" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="750" y1="102" x2="806" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="860" y1="134" x2="700" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="910" y1="134" x2="890" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="885" y1="254" x2="885" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="210" y1="380" x2="226" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="390" y1="380" x2="406" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="380" x2="586" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="760" y1="380" x2="776" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="675" y1="410" x2="675" y2="436" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
