<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Data model by domain (main collections)</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#475569">Almost every record carries a user ID and soft-delete fields. Links are stored as IDs.</text>

  <!-- Users -->
  <rect x="380" y="80" width="240" height="120" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="500" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">Identity and tenancy</text>
  <text x="500" y="130" text-anchor="middle" font-size="12" fill="#1e1b4b">users (parent / client / sub-user)</text>
  <text x="500" y="148" text-anchor="middle" font-size="12" fill="#1e1b4b">access tokens, platforms (white-label)</text>
  <text x="500" y="166" text-anchor="middle" font-size="12" fill="#1e1b4b">custom domains, satellite servers</text>

  <!-- Contacts -->
  <rect x="30" y="250" width="270" height="130" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="165" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">Contacts and engagement</text>
  <text x="165" y="300" text-anchor="middle" font-size="12" fill="#064e3b">contacts (tags, status, last sent / open / click)</text>
  <text x="165" y="318" text-anchor="middle" font-size="12" fill="#064e3b">contact histories, status transitions</text>
  <text x="165" y="336" text-anchor="middle" font-size="12" fill="#064e3b">custom fields, smart lists</text>
  <text x="165" y="354" text-anchor="middle" font-size="12" fill="#064e3b">email validation queues</text>

  <!-- Tags/workflows -->
  <rect x="365" y="250" width="270" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Tags and workflows</text>
  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#78350f">tags, tag groups, tag actions, tag tasks</text>
  <text x="500" y="318" text-anchor="middle" font-size="12" fill="#78350f">workflows, workflow flows (steps)</text>
  <text x="500" y="336" text-anchor="middle" font-size="12" fill="#78350f">workflow queues (one per contact)</text>
  <text x="500" y="354" text-anchor="middle" font-size="12" fill="#78350f">workflow queue flows (state per step)</text>

  <!-- Email -->
  <rect x="700" y="250" width="270" height="130" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="835" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Email and messaging</text>
  <text x="835" y="300" text-anchor="middle" font-size="12" fill="#831843">broadcast emails and recipients</text>
  <text x="835" y="318" text-anchor="middle" font-size="12" fill="#831843">conversations (per-message state)</text>
  <text x="835" y="336" text-anchor="middle" font-size="12" fill="#831843">email events, webhook logs, templates</text>
  <text x="835" y="354" text-anchor="middle" font-size="12" fill="#831843">sending domains, SMS numbers, queue logs</text>

  <!-- Sales -->
  <rect x="30" y="430" width="230" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="145" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Sales</text>
  <text x="145" y="480" text-anchor="middle" font-size="12" fill="#4c1d95">pipelines, stages, leads</text>
  <text x="145" y="498" text-anchor="middle" font-size="12" fill="#4c1d95">deals, activities, lead emails</text>
  <text x="145" y="516" text-anchor="middle" font-size="12" fill="#4c1d95">lead histories and forms</text>

  <!-- Appointments -->
  <rect x="285" y="430" width="210" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Appointments</text>
  <text x="390" y="480" text-anchor="middle" font-size="12" fill="#4c1d95">appointments</text>
  <text x="390" y="498" text-anchor="middle" font-size="12" fill="#4c1d95">bookings, groups</text>

  <!-- Integrations -->
  <rect x="520" y="430" width="240" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="640" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Integration catalog</text>
  <text x="640" y="480" text-anchor="middle" font-size="12" fill="#0f172a">integrations, triggers, actions</text>
  <text x="640" y="498" text-anchor="middle" font-size="12" fill="#0f172a">OAuth and API-key accounts</text>
  <text x="640" y="516" text-anchor="middle" font-size="12" fill="#0f172a">categories, action jobs</text>

  <!-- Other -->
  <rect x="785" y="430" width="185" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="877" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Other</text>
  <text x="877" y="480" text-anchor="middle" font-size="12" fill="#0f172a">chat bots, QR codes</text>
  <text x="877" y="498" text-anchor="middle" font-size="12" fill="#0f172a">rewards, images</text>
  <text x="877" y="516" text-anchor="middle" font-size="12" fill="#0f172a">notifications, lead ads</text>

  <!-- arrows from users -->
  <line x1="430" y1="200" x2="200" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="200" x2="500" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="200" x2="800" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- contacts <-> tags -->
  <line x1="300" y1="315" x2="361" y2="315" stroke="#475569" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- tags -> email -->
  <line x1="635" y1="315" x2="696" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- contacts -> sales -->
  <line x1="120" y1="380" x2="120" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- contacts -> appointments -->
  <line x1="230" y1="380" x2="350" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- tags -> integrations -->
  <line x1="540" y1="380" x2="600" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="500" y="590" text-anchor="middle" font-size="12" fill="#475569">Arrows show the main direction of ownership or reference, not every link.</text>
</svg>
