<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Global Control Server: system architecture</text>

  <!-- Clients -->
  <rect x="30" y="80" width="190" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="125" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Web app (Vue)</text>
  <text x="125" y="126" text-anchor="middle" font-size="12" fill="#1e1b4b">REST + live updates</text>
  <rect x="30" y="160" width="190" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="125" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">API-key users</text>
  <text x="125" y="206" text-anchor="middle" font-size="12" fill="#1e1b4b">external systems, AI agents</text>
  <rect x="30" y="240" width="190" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="125" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Public pages</text>
  <text x="125" y="286" text-anchor="middle" font-size="12" fill="#1e1b4b">booking, chat bot, tracking</text>

  <!-- API -->
  <rect x="300" y="80" width="270" height="220" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="435" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">Express API (Node 20)</text>
  <rect x="320" y="120" width="230" height="38" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="435" y="144" text-anchor="middle" font-size="13" fill="#064e3b">Routes and validation</text>
  <rect x="320" y="170" width="230" height="38" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="435" y="194" text-anchor="middle" font-size="13" fill="#064e3b">Controllers</text>
  <rect x="320" y="220" width="230" height="38" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="435" y="244" text-anchor="middle" font-size="13" fill="#064e3b">Libs: tags, workflows, email, contacts</text>
  <text x="435" y="284" text-anchor="middle" font-size="12" fill="#065f46">Socket.IO gateway for live events</text>

  <!-- MongoDB -->
  <rect x="680" y="80" width="290" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="825" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">MongoDB (Mongoose)</text>
  <text x="825" y="136" text-anchor="middle" font-size="12" fill="#78350f">about 100 collections</text>
  <text x="825" y="156" text-anchor="middle" font-size="12" fill="#78350f">contacts, tags, workflows, email, pipelines</text>

  <!-- Object storage -->
  <rect x="680" y="200" width="290" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="825" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Object storage (S3-compatible)</text>
  <text x="825" y="246" text-anchor="middle" font-size="12" fill="#78350f">images, newsletter assets</text>

  <!-- Redis / queues -->
  <rect x="300" y="350" width="270" height="110" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="435" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">BullMQ queues (Redis)</text>
  <text x="435" y="402" text-anchor="middle" font-size="12" fill="#831843">tags, actions, broadcast email</text>
  <text x="435" y="420" text-anchor="middle" font-size="12" fill="#831843">workflow timers, email validation</text>
  <text x="435" y="438" text-anchor="middle" font-size="12" fill="#831843">appointment reminders, SSL jobs</text>

  <!-- Workers -->
  <rect x="680" y="350" width="290" height="110" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="825" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Workers and cron jobs</text>
  <text x="825" y="402" text-anchor="middle" font-size="12" fill="#831843">run workflow steps and send messages</text>
  <text x="825" y="420" text-anchor="middle" font-size="12" fill="#831843">daily contact status decay</text>
  <text x="825" y="438" text-anchor="middle" font-size="12" fill="#831843">reconcile held email events</text>

  <!-- Satellite -->
  <rect x="30" y="350" width="190" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="125" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Satellite servers</text>
  <text x="125" y="402" text-anchor="middle" font-size="12" fill="#4c1d95">same codebase, heavy jobs:</text>
  <text x="125" y="420" text-anchor="middle" font-size="12" fill="#4c1d95">broadcasts, tag fires, imports</text>

  <!-- External services -->
  <rect x="30" y="520" width="940" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="546" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Third-party services</text>
  <text x="500" y="572" text-anchor="middle" font-size="13" fill="#334155">Mailgun   |   SendGrid   |   SMTP providers   |   Twilio   |   OpenAI   |   Google APIs   |   Facebook lead ads   |   Cloudflare</text>
  <text x="500" y="594" text-anchor="middle" font-size="12" fill="#475569">Most calls go through a database-defined integration engine. Providers report back through webhooks.</text>

  <!-- arrows -->
  <line x1="220" y1="110" x2="296" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="190" x2="296" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="270" x2="296" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="140" x2="676" y2="130" stroke="#475569" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="570" y1="250" x2="676" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="435" y1="300" x2="435" y2="346" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="405" x2="676" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="825" y1="350" x2="825" y2="184" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="300" y1="270" x2="224" y2="352" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="125" y1="460" x2="125" y2="516" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="825" y1="460" x2="825" y2="516" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="516" x2="500" y2="466" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="520" y="494" font-size="11" fill="#475569">webhooks to API</text>
</svg>
